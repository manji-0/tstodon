version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The browser e2e suite runs on the Chromium revision @playwright/test
      # 1.63.0 expects, the one preinstalled where it usually runs (see
      # docs/getting-started/e2e-web.md).
      - dependency-name: "@playwright/test"
      # The web UI's dependencies below are held at Mastodon's versions (the
      # upstream release in packages/worker/src/UPSTREAM.md). They move when
      # the vendored UI moves to a newer upstream release, through
      # docs/operations/mastodon-web-upstream.md. Each was tried and changes
      # the UI's behaviour; UPSTREAM.md lists the ones tstodon took instead.
      #
      # path-to-regexp 1 is react-router 5's path syntax, which the UI's
      # route table keeps (`/@:acct`); later majors parse paths differently.
      - dependency-name: path-to-regexp
        update-types: [version-update:semver-major]
      # Immutable 5's types break the UI's typed store models.
      - dependency-name: immutable
        update-types: [version-update:semver-major]
      # react-intl 12 changes formatMessage's types across the UI.
      - dependency-name: react-intl
        update-types: [version-update:semver-major]
      # Emoji 17 data: emoji the fetched twemoji set has no image for, and
      # renamed shortcodes.
      - dependency-name: emojibase
        update-types: [version-update:semver-major]
      - dependency-name: emojibase-data
        update-types: [version-update:semver-major]
      - dependency-name: emojibase-regex
        update-types: [version-update:semver-major]
      # Newer CLDR data changes plural categories the polyfill picks.
      - dependency-name: "@formatjs/intl-pluralrules"
      # fuzzysort 4 ranks the language picker's results differently.
      - dependency-name: fuzzysort
        update-types: [version-update:semver-major]
      # Types for emoji-mart 5; the UI uses emoji-mart-lazyload, a v3 fork.
      - dependency-name: "@types/emoji-mart"
        update-types: [version-update:semver-major]
      # 2.2.0 is a deprecated stub; react-immutable-proptypes ships its types.
      - dependency-name: "@types/react-immutable-proptypes"
      # Newer releases pull newer browserslist data, which moves the build's
      # browser targets (the legacy bundle and CSS prefixes); core-js is the
      # legacy bundle's polyfills. The e2e suite cannot see either change.
      - dependency-name: browserslist
      - dependency-name: "@vitejs/plugin-legacy"
      - dependency-name: postcss-preset-env
      - dependency-name: core-js
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
