name: e2e-federation

# tstodon-to-tstodon federation e2e (docs/getting-started/e2e-federation.md):
# two Workers in `vp dev` on loopback, each scenario of `pnpm e2e:federation:*`
# against them. A workflow of its own, not a job in ci.yml, for the same
# reason as e2e-mastodon.yml: a run takes several minutes, so a pull request
# runs it only when it touches what the two servers say to each other, and a
# nightly run covers the rest.
on:
  pull_request:
    branches:
      - main
    paths:
      - packages/worker/server/**
      - packages/worker/app/**
      - packages/worker/vite.config.ts
      - packages/worker/void-plugins.ts
      - packages/worker/package.json
      - packages/api/**
      - packages/domain/**
      - packages/core/**
      - e2e/federation-*.ts
      - e2e/federation-ci.sh
      - e2e/lib.ts
      - e2e/schemas.ts
      - e2e/a.wrangler.jsonc
      - e2e/b.wrangler.jsonc
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/e2e-federation.yml
  schedule:
    - cron: "43 19 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e-federation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # From nothing to nothing: fresh databases, both Workers, every
      # scenario, the logs, the teardown.
      - name: Federation e2e
        run: e2e/federation-ci.sh

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-federation-logs
          path: .cache/e2e-federation
          include-hidden-files: true
          retention-days: 7
