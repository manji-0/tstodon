name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        # Pinned to v1.21.2; setup-vp's README asks for an exact release.
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version: 26
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Generate Worker types
        run: vp run types:worker

      - name: Check (format, lint, types)
        run: vp check

      - name: Check D1 result calls take no type argument
        run: node scripts/check-d1-type-arguments.mjs

      # Mastodon's web frontend (packages/worker/src) on the workspace's
      # TypeScript and Vitest.
      - name: Typecheck web frontend
        run: vp run typecheck:web

      # One Void build: the client (Mastodon's web frontend, plus upstream's
      # public/emoji fetched from the pinned tag) first, then the Worker, into
      # packages/worker/dist/. The Worker tests run against it.
      - name: Build
        run: vp -C packages/worker build

      - name: Test
        run: vp test run

      # Mastodon's emoji test reads public/emoji (fetched by the build, or by
      # packages/worker/vitest.config.ts when missing).
      - name: Test web frontend
        run: vp run test:web

      - name: Wrangler dry-run
        if: github.event_name != 'pull_request'
        working-directory: packages/worker
        run: vp exec wrangler deploy --dry-run

  # Browser e2e (e2e/web, docs/getting-started/e2e-web.md): Mastodon's web UI
  # against the Worker in Void's dev server. A separate job so a slow or
  # broken browser setup does not hold up the checks above.
  e2e-web:
    name: e2e-web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        # Pinned to v1.21.2; setup-vp's README asks for an exact release.
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version: 26
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # The Chromium headless shell the pinned @playwright/test expects.
      - name: Install Chromium
        run: vp exec playwright install --with-deps chromium

      - name: Browser e2e
        run: vp run e2e:web

      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-results
          path: .cache/e2e-web/results
          include-hidden-files: true
          retention-days: 7
