name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        # Pinned to v1.21.2; setup-vp's README asks for an exact release.
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version: 26
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Generate Worker types
        run: vp run types:worker

      - name: Check (format, lint, types)
        run: vp check

      - name: Check D1 result calls take no type argument
        run: node scripts/check-d1-type-arguments.mjs

      # Mastodon's web UI (packages/web). The build fetches public/emoji and
      # public/ocr from the pinned upstream tag (Mastodon's emoji test reads
      # them) and fills packages/worker/assets, so the Worker's web app tests
      # run against a real build instead of skipping.
      - name: Build web UI
        run: vp run web:build

      - name: Typecheck web UI
        run: vp run @tstodon/web#typecheck

      - name: Test web UI
        run: vp run @tstodon/web#test:js run

      # Worker tests run against the Void build output in packages/worker/dist/.
      - name: Build
        run: vp -C packages/worker build

      - name: Test
        run: vp test run

      - name: Wrangler dry-run
        if: github.event_name != 'pull_request'
        working-directory: packages/worker
        run: vp exec wrangler deploy --dry-run
