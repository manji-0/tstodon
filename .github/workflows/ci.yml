name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    # A run takes about 12 minutes; a slow runner took 15 and was cancelled.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        # Pinned to v1.21.2; setup-vp's README asks for an exact release.
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # `pnpm audit --prod --audit-level=high`. The overrides that clear
      # advisories and the reviewed ignore list are in pnpm-workspace.yaml.
      - name: Audit production dependencies
        run: vp pm audit --production --level high

      - name: Generate Worker types
        run: vp run types:worker

      - name: Check (format, lint, types)
        run: vp check

      - name: Check D1 result calls take no type argument
        run: node scripts/check-d1-type-arguments.mjs

      - name: Check destructive migrations carry Void's pragma
        run: node scripts/check-migrations.mjs

      # Mastodon's web frontend (packages/worker/src) on the workspace's
      # TypeScript and Vitest.
      - name: Typecheck web frontend
        run: vp run typecheck:web

      # One Void build: the client (Mastodon's web frontend, plus upstream's
      # public/emoji fetched from the pinned tag) first, then the Worker, into
      # packages/worker/dist/. The Worker tests run against it.
      - name: Build
        run: vp -C packages/worker build

      - name: Test
        run: vp test run

      # Mastodon's emoji test reads public/emoji (fetched by the build, or by
      # packages/worker/vitest.config.ts when missing).
      - name: Test web frontend
        run: vp run test:web

      - name: Wrangler dry-run
        if: github.event_name != 'pull_request'
        working-directory: packages/worker
        run: vp exec wrangler deploy --dry-run --config dist/ssr/wrangler.json

  # Browser e2e (e2e/web, docs/getting-started/e2e-web.md): Mastodon's web UI
  # against the Worker in Void's dev server. A separate job so a slow or
  # broken browser setup does not hold up the checks above.
  e2e-web:
    name: e2e-web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        # Pinned to v1.21.2; setup-vp's README asks for an exact release.
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # The Chromium headless shell the pinned @playwright/test expects.
      - name: Install Chromium
        run: vp exec playwright install --with-deps chromium

      - name: Browser e2e
        run: vp run e2e:web

      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-results
          path: .cache/e2e-web/results
          include-hidden-files: true
          retention-days: 7

  # infra/cloudflare (OpenTofu): formatting, and the configuration against the
  # Cloudflare provider's schema. No state, no credentials, nothing applied.
  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - name: Format
        run: tofu fmt -check -recursive -diff infra

      - name: Validate
        working-directory: infra/cloudflare
        run: |
          tofu init -backend=false -input=false
          tofu validate
