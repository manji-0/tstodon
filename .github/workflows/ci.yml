name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        # Pinned to v1.21.2; setup-vp's README asks for an exact release.
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Generate Worker types
        run: vp run types:worker

      - name: Check (format, lint, types)
        run: vp check

      # Worker tests run against the Void build output in packages/worker/dist/.
      - name: Build
        run: vp -C packages/worker build

      - name: Test
        run: vp test run

      - name: Wrangler dry-run
        if: github.event_name != 'pull_request'
        working-directory: packages/worker
        run: vp exec wrangler deploy --dry-run
