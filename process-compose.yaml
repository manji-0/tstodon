version: "0.5"

processes:
  tstodon-a:
    command: pnpm exec vp -C packages/worker dev --port 8791 --strictPort --host 127.0.0.1
    environment:
      - CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=../../e2e/a.wrangler.jsonc
      - VOID_INSPECTOR_PORT=false
      - TSTODON_PERSIST_TO=.wrangler/e2e-a
    availability:
      restart: "always"
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 8791
        path: "/.well-known/nodeinfo"
      initial_delay_seconds: 2
      period_seconds: 2
      failure_threshold: 30

  tstodon-b:
    command: pnpm exec vp -C packages/worker dev --port 8792 --strictPort --host 127.0.0.1
    environment:
      - CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=../../e2e/b.wrangler.jsonc
      - VOID_INSPECTOR_PORT=false
      - TSTODON_PERSIST_TO=.wrangler/e2e-b
    availability:
      restart: "always"
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 8792
        path: "/.well-known/nodeinfo"
      initial_delay_seconds: 2
      period_seconds: 2
      failure_threshold: 30

  e2e-federation-smoke:
    command: pnpm exec tsx e2e/federation-smoke.ts
    depends_on:
      tstodon-a:
        condition: process_healthy
      tstodon-b:
        condition: process_healthy
    availability:
      restart: "no"

  e2e-federation-follow-create:
    command: pnpm exec tsx e2e/federation-follow-create.ts
    depends_on:
      tstodon-a:
        condition: process_healthy
      tstodon-b:
        condition: process_healthy
    availability:
      restart: "no"

  e2e-federation-interactions:
    command: pnpm exec tsx e2e/federation-interactions.ts
    depends_on:
      tstodon-a:
        condition: process_healthy
      tstodon-b:
        condition: process_healthy
    availability:
      restart: "no"

  e2e-federation-delete-shared-inbox:
    command: pnpm exec tsx e2e/federation-delete-shared-inbox.ts
    depends_on:
      tstodon-a:
        condition: process_healthy
      tstodon-b:
        condition: process_healthy
    availability:
      restart: "no"

  e2e-federation-accept:
    command: pnpm exec tsx e2e/federation-accept.ts
    depends_on:
      tstodon-a:
        condition: process_healthy
      tstodon-b:
        condition: process_healthy
    availability:
      restart: "no"
