packages:
  - packages/*

allowBuilds:
  # void ships better-sqlite3 for `void db`; tstodon manages D1 with wrangler.
  better-sqlite3: false
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  workerd: true
  # packages/web (Mastodon's frontend). None of these scripts is needed to
  # build it: @parcel/watcher ships prebuilt binaries, core-js and
  # tesseract.js only print a message, unrs-resolver's only repairs missing
  # optional binaries, and msw's would rewrite the committed
  # .storybook/static/mockServiceWorker.js.
  "@parcel/watcher": false
  core-js: false
  msw: false
  tesseract.js: false
  unrs-resolver: false

# Fresh Oxc / TypeScript releases are intentionally allowed through the age gate.
minimumReleaseAgeExclude:
  - oxlint
  - oxfmt
  - oxlint-tsgolint
  - typescript
  - "@oxlint/*"
  - "@oxfmt/*"
  - "@oxlint-tsgolint/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # packages/web (Mastodon's frontend) builds and tests with the Vite and
  # Vitest releases Mastodon pins, not Vite+. A parent-scoped override wins
  # over the generic ones above.
  "@tstodon/web>vite": 8.2.1
  "@tstodon/web>vitest": 4.1.10
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
