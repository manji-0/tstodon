packages:
  - packages/*

# The v13 lockfile: one `packages` entry per version with its peers inline,
# so a peer bump changes only the lines that record it.
lockfile:
  format: v13

allowBuilds:
  # void ships better-sqlite3 for `void db`; tstodon manages D1 with wrangler.
  better-sqlite3: false
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  workerd: true
  # Mastodon's frontend (packages/worker/src). None of these scripts is
  # needed to build it: @parcel/watcher ships prebuilt binaries, and core-js
  # and tesseract.js only print a message.
  "@parcel/watcher": false
  core-js: false
  tesseract.js: false
  # A peer of Vitest's browser mocker; its script only copies a service worker
  # file into a project that asks for one.
  msw: false

# Fresh Oxc / TypeScript releases are intentionally allowed through the age gate.
minimumReleaseAgeExclude:
  - oxlint
  - oxfmt
  - oxlint-tsgolint
  - typescript
  - "@oxlint/*"
  - "@oxfmt/*"
  - "@oxlint-tsgolint/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # Security fixes for transitive dependencies, so that CI's
  # `pnpm audit --prod --audit-level=high` passes. Each lifts a vulnerable
  # range to the first fixed release; drop an entry once its parent requires
  # the fix itself.
  # prisma's config loader (`prisma generate --sql`, a development tool):
  # GHSA-ggr8-5vv4-36mx. 8.0 drops Node < 16 and keeps `deepmerge`.
  deepmerge-ts@<8.0.0: ^8.0.2
  # better-auth's optional Prisma and Drizzle adapters, which tstodon does not
  # load: GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3.
  mysql2@<3.23.1: ^3.23.1
  # svgr's cosmiconfig, at build time: GHSA-2883-xcg3-v3hh.
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  # jsdom, through better-auth's optional vitest peer: the undici advisories
  # fixed in 8.12.2.
  undici@>=8.0.0 <8.12.2: ^8.12.2
  # axios's redirect follower (GHSA-q3jh-wrc6-jgq8, GHSA-8r9p-f939-6h3c,
  # GHSA-mrwp-f3q8-3g9p).
  follow-redirects@<1.16.2: ^1.16.2
  # Prisma's ajv: GHSA-w74x-v6f9-j3xg and three more.
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  # postcss-preset-env, at build time: GHSA-rj75-hqrm-r3gf.
  postcss-selector-parser@>=7.0.0 <7.1.6: ^7.1.6
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
patchedDependencies:
  jsonld@9.0.0: patches/jsonld@9.0.0.patch
# Advisories CI's audit skips, each with the reason it does not apply here.
# Prefer an override above; list an advisory only when no fixed release fits
# the package that pulls it in.
auditConfig:
  ignoreGhsas:
    # esbuild's dev server answers requests from any origin (moderate). Only
    # esbuild 0.18, under drizzle-kit's deprecated @esbuild-kit loader:
    # drizzle-kit is an optional peer of better-auth that tstodon never runs,
    # and the fix is esbuild 0.25, a breaking 0.x release @esbuild-kit does not
    # take.
    - GHSA-67mh-4wv8-2f99
