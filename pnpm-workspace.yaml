packages:
  - packages/*

allowBuilds:
  # void ships better-sqlite3 for `void db`; tstodon manages D1 with wrangler.
  better-sqlite3: false
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  workerd: true
  # Mastodon's frontend (packages/worker/src). None of these scripts is
  # needed to build it: @parcel/watcher ships prebuilt binaries, and core-js
  # and tesseract.js only print a message.
  "@parcel/watcher": false
  core-js: false
  tesseract.js: false
  # A peer of Vitest's browser mocker; its script only copies a service worker
  # file into a project that asks for one.
  msw: false

# Fresh Oxc / TypeScript releases are intentionally allowed through the age gate.
minimumReleaseAgeExclude:
  - oxlint
  - oxfmt
  - oxlint-tsgolint
  - typescript
  - "@oxlint/*"
  - "@oxfmt/*"
  - "@oxlint-tsgolint/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
